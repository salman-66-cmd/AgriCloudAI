version: '3.8'

services:
  # ==============================================================================
  # Managed PostgreSQL Database Service
  # ==============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: agricloud-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: agricloud_user
      POSTGRES_PASSWORD: agricloud_secure_password_2026
      POSTGRES_DB: agricloud_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agricloud_user -d agricloud_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==============================================================================
  # AgriCloud Backend REST API & Realtime Worker Service
  # ==============================================================================
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: agricloud-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://agricloud_user:agricloud_secure_password_2026@postgres:5432/agricloud_db?schema=public
      JWT_ACCESS_SECRET: agricloud_docker_production_access_secret_2026_super_secure
      JWT_REFRESH_SECRET: agricloud_docker_production_refresh_secret_2026_super_secure
      JWT_ACCESS_EXPIRATION: 15m
      JWT_REFRESH_EXPIRATION: 7d
      CORS_ORIGIN: http://localhost,http://localhost:80,http://localhost:5173,http://localhost:3000
      SIMULATION_ENABLED: "true"
      SIMULATION_INTERVAL_SECONDS: "10"
      SIMULATION_FAULT_CHANCE: "0.02"
      SIMULATION_RAIN_CHANCE: "0.08"
      MAX_CONTINUOUS_IRRIGATION_SECONDS: "1800"
      IRRIGATION_COOLDOWN_DEFAULT_MINUTES: "60"
    ports:
      - "5000:5000"

  # ==============================================================================
  # AgriCloud Frontend Web Dashboard Service (Nginx SPA)
  # ==============================================================================
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: agricloud-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"

volumes:
  postgres_data:
    driver: local
